name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e . pytest rapidfuzz pillow
      # Typer forces a colour terminal when GITHUB_ACTIONS is set, which splits
      # option names in error messages with escape codes; the CLI tests read them.
      - run: pytest -q
        env:
          _TYPER_FORCE_DISABLE_TERMINAL: "1"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "editionist"
version = "0.1.0"
description = "Programmatic infrastructure for agent-assisted digitization of historical scholarly texts: native Gemini Batch VLM transcription, OCR second witness, collation oracle, edition rules."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Julio Alonzom" }]
keywords = ["digitization", "transcription", "ocr", "gemini", "latin", "scholarly-editions", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]

[project.scripts]
ed-batch-submit = "editionist.gemini_batch_run:main"
ed-batch-poll = "editionist.gemini_batch_run:main"
ed-batch-raw = "editionist.batch_raw:main"
ed-poll-batch = "editionist.poll_batch:main"
ed-ct-oracle = "editionist.ct_oracle:main"
ed-check-markers = "editionist.check_markers:main"

[tool.hatch.build.targets.wheel]
packages = ["src/editionist"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exscriptor"
version = "0.1.0"
description = "Programmatic infrastructure for agent-assisted digitization of historical scholarly texts: native Gemini Batch VLM transcription, OCR second witness, collation oracle, edition rules."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Julio Alonzom" }]
keywords = ["digitization", "transcription", "ocr", "gemini", "latin", "scholarly-editions", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]

[project.scripts]
ex-batch-submit = "exscriptor.gemini_batch_run:main"
ex-batch-poll = "exscriptor.gemini_batch_run:main"
ex-batch-raw = "exscriptor.batch_raw:main"
ex-poll-batch = "exscriptor.poll_batch:main"
ex-witness = "exscriptor.witness:main"
ex-check-markers = "exscriptor.check_markers:main"

[tool.hatch.build.targets.wheel]
packages = ["src/exscriptor"]
